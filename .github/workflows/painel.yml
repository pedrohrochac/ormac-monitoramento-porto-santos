name: Painel Porto de Santos

on:
  schedule:
    - cron: "5 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: painel
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Completar a cadeia de certificados da SPA
        continue-on-error: true
        run: |
          set -x
          HOST=www.portodesantos.com.br
          openssl s_client -connect $HOST:443 -servername $HOST </dev/null 2>/dev/null \
            | openssl x509 -outform PEM > folha.pem
          URI=$(openssl x509 -in folha.pem -noout -text \
            | grep -o 'CA Issuers - URI:[^ ]*' | head -1 | cut -d: -f2-)
          echo "intermediario em: $URI"
          curl -sL "$URI" -o inter.bin
          openssl x509 -inform DER -in inter.bin -out inter.pem 2>/dev/null \
            || cp inter.bin inter.pem
          cat "$(python -c 'import certifi; print(certifi.where())')" inter.pem \
            > ca-bundle.pem
          openssl verify -CAfile ca-bundle.pem folha.pem || true
          echo "REQUESTS_CA_BUNDLE=$PWD/ca-bundle.pem" >> $GITHUB_ENV

      - name: Coletar e montar o painel
        run: python main.py

      - name: Guardar o histórico
        run: |
          mkdir -p site
          cp painel.html site/index.html
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A monitor_santos.db painel.html
          git diff --staged --quiet || git commit -m "coleta $(date '+%d/%m %H:%M')"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
