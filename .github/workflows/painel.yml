name: Painel Porto de Santos

on:
  schedule:
    - cron: "5 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: painel
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Coletar e montar o painel
        run: python main.py

      - name: Guardar o histórico
        run: |
          mkdir -p site
          cp painel.html site/index.html
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A monitor_santos.db painel.html
          git diff --staged --quiet || git commit -m "coleta $(date '+%d/%m %H:%M')"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
